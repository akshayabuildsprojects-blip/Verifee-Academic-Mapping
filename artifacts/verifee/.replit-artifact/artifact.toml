kind = "web"
previewPath = "/"
title = "Verifee"
description = "A preliminary academic credential interpretation and course-mapping platform. Upload an English-language academic credential, choose a Georgia Tech requirement, and review a clear, evidence-based mapping report with verification kept separate from interpretation."
version = "1.0.0"
id = "artifacts/verifee"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22798

[services.development]
run = "pnpm --filter @workspace/verifee run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/verifee", "run", "build" ]
serve = "static"
publicDir = "artifacts/verifee/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22798"
BASE_PATH = "/"
