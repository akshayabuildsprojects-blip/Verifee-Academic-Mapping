openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: credential-extraction
    description: Academic transcript PDF interpretation
  - name: academic-mapping
    description: Preliminary course-to-requirement mapping
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /academic-transcripts/extract:
    post:
      operationId: extractAcademicTranscript
      tags: [credential-extraction]
      summary: Extract academic information from a transcript PDF
      description: Reads a PDF for academic interpretation only; it does not verify authenticity.
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              $ref: "#/components/schemas/AcademicTranscriptPdf"
      responses:
        "200":
          description: Structured academic record extracted from the PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicRecord"
        "400":
          description: The request did not contain a valid PDF
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The PDF exceeds the 20 MB upload limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Only PDF uploads are supported for extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The PDF could not be interpreted as an academic transcript
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The extraction request limit was reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The extraction provider returned an unusable response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The extraction provider is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /academic-mappings/run:
    post:
      operationId: runAcademicMapping
      tags: [academic-mapping]
      summary: Compare an extracted academic record with a stored Georgia Tech program
      description: Uses only the extracted academic JSON and one of the stored Georgia Tech program definitions. No PDF bytes are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicMappingInput"
      responses:
        "200":
          description: Structured preliminary mapping and course evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicMappingResult"
        "400":
          description: The mapping request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The academic mapping request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The mapping request limit was reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The mapping service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /academic-mappings/run/stream:
    post:
      operationId: streamAcademicMapping
      tags: [academic-mapping]
      summary: Stream completed academic mapping requirements
      description: Uses the same mapper and input as runAcademicMapping. Each progress event contains an AcademicMappingResult snapshot with only completed requirements; the complete event contains the unchanged final AcademicMappingResult.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicMappingInput"
      responses:
        "200":
          description: Server-sent events carrying the existing mapping result shape
          content:
            text/event-stream:
              schema:
                type: string
                description: Each progress or complete event's data is an AcademicMappingResult; error event data uses ErrorResponse.
        "400":
          description: The mapping request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The academic mapping request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: The mapping request limit was reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The mapping service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AcademicTranscriptPdf:
      type: string
      format: binary
      description: PDF bytes; processed in memory and not persisted.
    AcademicRecord:
      type: object
      additionalProperties: false
      properties:
        institution:
          $ref: "#/components/schemas/AcademicInstitution"
        credential:
          $ref: "#/components/schemas/AcademicCredential"
        academicRecord:
          $ref: "#/components/schemas/AcademicRecordDetails"
      required:
        - institution
        - credential
        - academicRecord
    AcademicInstitution:
      type: object
      additionalProperties: false
      properties:
        name:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
      required:
        - name
        - country
    AcademicCredential:
      type: object
      additionalProperties: false
      properties:
        degree:
          type: ["string", "null"]
        program:
          type: ["string", "null"]
        fieldOfStudy:
          type: ["string", "null"]
        graduationDate:
          type: ["string", "null"]
      required:
        - degree
        - program
        - fieldOfStudy
        - graduationDate
    AcademicRecordDetails:
      type: object
      additionalProperties: false
      properties:
        creditSystem:
          type: ["string", "null"]
        cumulativeGPA:
          type: ["string", "null"]
        courses:
          type: array
          items:
            $ref: "#/components/schemas/AcademicCourse"
      required:
        - creditSystem
        - cumulativeGPA
        - courses
    AcademicCourse:
      type: object
      additionalProperties: false
      properties:
        code:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        credits:
          type: ["string", "null"]
        grade:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
      required:
        - code
        - title
        - credits
        - grade
        - description
    AcademicMappingInput:
      type: object
      additionalProperties: false
      properties:
        programId:
          type: string
          enum:
            - ms-analytics
            - ms-computer-science
            - ms-industrial-engineering
        record:
          $ref: "#/components/schemas/AcademicRecord"
      required:
        - programId
        - record
    CourseEvidenceSource:
      type: object
      additionalProperties: false
      properties:
        title:
          type: ["string", "null"]
        url:
          type: string
          format: uri
      required:
        - title
        - url
    AcademicCourseEvidence:
      type: object
      additionalProperties: false
      properties:
        courseIndex:
          type: integer
          minimum: 0
        code:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        transcriptDescription:
          type: ["string", "null"]
        researchStatus:
          type: string
          enum:
            - OFFICIAL_SOURCES_FOUND
            - TRANSCRIPT_DESCRIPTION_ONLY
            - NO_AUTHORITATIVE_SOURCE
            - DEMO_DESCRIPTION
        findings:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CourseEvidenceSource"
      required:
        - courseIndex
        - code
        - title
        - transcriptDescription
        - researchStatus
        - findings
        - sources
    AcademicCourseCandidate:
      type: object
      additionalProperties: false
      properties:
        courseIndex:
          type: integer
          minimum: 0
        code:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        relevance:
          type: string
          enum:
            - LIKELY_RELEVANT
            - POSSIBLY_RELEVANT
        evidence:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CourseEvidenceSource"
      required:
        - courseIndex
        - code
        - title
        - relevance
        - evidence
        - sources
    AcademicRequirementMapping:
      type: object
      additionalProperties: false
      properties:
        requirementId:
          type: string
        requirementName:
          type: string
        category:
          type: string
        importance:
          type: string
        matchingConcepts:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - COVERED
            - PARTIALLY_COVERED
            - INSUFFICIENT_EVIDENCE
            - POTENTIAL_GAP
        confidence:
          type: string
          enum:
            - HIGH
            - MEDIUM
            - LOW
        candidateCourses:
          type: array
          items:
            $ref: "#/components/schemas/AcademicCourseCandidate"
        evidence:
          type: array
          items:
            type: string
        rationale:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CourseEvidenceSource"
      required:
        - requirementId
        - requirementName
        - category
        - importance
        - matchingConcepts
        - status
        - confidence
        - candidateCourses
        - evidence
        - rationale
        - sources
    AcademicMappingResult:
      type: object
      additionalProperties: false
      properties:
        programId:
          type: string
          enum:
            - ms-analytics
            - ms-computer-science
            - ms-industrial-engineering
        programName:
          type: string
        institutionName:
          type: ["string", "null"]
        officialUniversityDomain:
          type: ["string", "null"]
        retryable:
          type: boolean
          description: True when a mapping or source-research step failed but partial results were returned.
        courseEvidence:
          type: array
          items:
            $ref: "#/components/schemas/AcademicCourseEvidence"
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/AcademicRequirementMapping"
      required:
        - programId
        - programName
        - institutionName
        - officialUniversityDomain
        - retryable
        - courseEvidence
        - requirements
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required:
        - error

